<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-labelledby="mmLogoTitle">
  <title id="mmLogoTitle">MM Mithaiwala — 50 Years — The Golden Collection</title>
  <defs>
    <style>
      .mm-wordnum   { font-family: Georgia, 'Times New Roman', serif; fill: #3B2E22; }
      .mm-wordcaps  { font-family: Georgia, 'Times New Roman', serif; fill: #3B2E22; letter-spacing: 2.5px; }
      .mm-wordital  { font-family: Georgia, 'Times New Roman', serif; font-style: italic; fill: #9C7B44; }
      .mm-line      { fill: none; stroke: #9C7B44; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .mm-line-thin { fill: none; stroke: #9C7B44; stroke-width: 1.4; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Lantern glyph -->
  <g transform="translate(14,18)">
    <!-- handle -->
    <path class="mm-line" d="M40 6 C40 -8, 66 -8, 66 6" />
    <!-- roof -->
    <path class="mm-line" d="M24 14 L54 14 L48 26 L18 26 Z" />
    <!-- body -->
    <rect class="mm-line" x="16" y="26" width="68" height="80" rx="3" />
    <!-- pointed arch window -->
    <path class="mm-line-thin" d="M36 96 V70 C36 54, 64 54, 64 70 V96" />
    <!-- jaali lattice hint, three diagonals -->
    <path class="mm-line-thin" d="M20 44 L46 30" />
    <path class="mm-line-thin" d="M20 56 L54 30" />
    <path class="mm-line-thin" d="M54 30 L80 44" />
    <!-- base -->
    <path class="mm-line" d="M10 106 H90 L84 118 H16 Z" />
    <!-- flame -->
    <path d="M50 74 C46 80, 46 86, 50 90 C54 86, 54 80, 50 74 Z" fill="#E4D5AF" stroke="#9C7B44" stroke-width="1" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(128,0)">
    <text x="0" y="78" class="mm-wordnum" font-size="72" font-weight="600">50</text>
    <text x="0" y="104" class="mm-wordcaps" font-size="15">YEARS OF MM MITHAIWALA</text>
    <text x="0" y="128" class="mm-wordital" font-size="17">The Golden Collection</text>
    <line x1="0" y1="140" x2="220" y2="140" stroke="#E4D5AF" stroke-width="1.5" />
  </g>
</svg>
